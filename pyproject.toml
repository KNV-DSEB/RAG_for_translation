[project]
name = "rag-for-translation"
version = "0.1.0"
description = "AI Assistant cho chuyên gia dịch thuật Việt–Anh: RAG tài liệu, Research Agent, Mock buổi dịch, Audio STT/TTS"
readme = "README.md"
# Pin cứng 3.11 — KHÔNG dùng Python 3.14 mặc định của máy (xem CLAUDE.md > Tech Stack)
requires-python = "==3.11.*"

dependencies = [
    # --- Backend ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",  # upload tệp qua FastAPI
    "httpx>=0.27",              # frontend -> backend

    # --- LLM (Gemini) ---
    "google-genai>=1.0",

    # --- RAG ---
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "olefile>=0.47",            # lớp fallback đọc .doc khi Word COM hỏng
    "pywin32>=306; sys_platform == 'win32'",  # Word COM đọc .doc
    "langdetect>=1.0.9",        # nhận diện VI/EN/song ngữ song song

    # --- Research Agent ---
    "ddgs>=6.0",                # duckduckgo-search (đã đổi tên thành ddgs)

    # --- Đọc lời thoại (TTS) ---
    # KHÔNG có nhận dạng giọng nói: đã bỏ tính năng ghi âm, chuyên gia gõ bản dịch.
    # Nhờ vậy bỏ được faster-whisper + ctranslate2 + av khỏi phần cài đặt.
    # (torch vẫn cần — sentence-transformers dùng cho embedding.)
    "edge-tts>=6.1",            # TTS chính
    "gTTS>=2.5",                # TTS fallback

    # --- Frontend ---
    # Giao diện là HTML/CSS/JS tự viết trong web/, FastAPI phục vụ tệp tĩnh.
    # KHÔNG dùng Streamlit (áp layout cố định, không có bản sắc riêng được)
    # và KHÔNG dùng Plotly (biểu đồ SVG tự vẽ trong web/js/charts.js).
    # Xem CLAUDE.md > Tech Stack.
    "pandas>=2.2",              # dùng cho xuất CSV bảng thuật ngữ

    # --- Tiện ích ---
    "psutil>=5.9",              # theo dõi RAM ở /health (ngân sách 7.8 GB)
]

[tool.uv]
# Đây là ứng dụng, không phải thư viện cần build
package = false

# CPU-only: driver GPU trên máy quá cũ cho CUDA của torch.
# Ép lấy wheel CPU để khỏi tải ~2.5 GB wheel CUDA vô ích.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
