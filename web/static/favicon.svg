<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Trợ lý phiên dịch Việt–Anh">
  <!-- Chữ ký của sản phẩm — "cái sống": hai cột song ngữ với một đường kẻ mảnh chạy dọc
       ở giữa. Đường kẻ đó CHÍNH LÀ việc phiên dịch: đi từ bên này sang bên kia.
       Trái navy = phía tiếng Việt (--vi #1B4079), phải mòng két = phía tiếng Anh
       (--en #175E63). Xem CLAUDE.md > UI/Design System. -->
  <rect width="32" height="32" rx="7" fill="#FAFBFD"/>
  <g fill="#1B4079">
    <rect x="6"  y="9"  width="9" height="2.6" rx="1.3"/>
    <rect x="6"  y="14.7" width="9" height="2.6" rx="1.3"/>
    <rect x="6"  y="20.4" width="6" height="2.6" rx="1.3"/>
  </g>
  <g fill="#175E63">
    <rect x="19" y="9"  width="7" height="2.6" rx="1.3"/>
    <rect x="19" y="14.7" width="9" height="2.6" rx="1.3"/>
    <rect x="19" y="20.4" width="8" height="2.6" rx="1.3"/>
  </g>
  <rect x="16.4" y="6" width="1.2" height="20" rx="0.6" fill="#0E1A2B" opacity=".38"/>
</svg>
